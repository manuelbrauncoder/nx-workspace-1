<app-ui-sheet
  [(open)]="open"
  [heading]="'layout.navigation' | t"
  side="right"
  fullWidth
  hideHeading
>
  <!-- A click on the logo on the start page triggers no navigation that would close the drawer. -->
  <app-logo (click)="open.set(false)" appUiSheetHeader />
  <div class="flex flex-col gap-4">
    <app-ui-icon class="mx-auto" name="user" size="xxl" />

    <app-ui-nav-menu
      [items]="_items()"
      [label]="'layout.mainNavigation' | t"
      orientation="vertical"
    />
  </div>
</app-ui-sheet>
