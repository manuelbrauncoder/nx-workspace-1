<div class="invite-row">
  <div class="invite-row__info">
    <h3 class="invite-row__title" appUiText="item">
      {{ 'teamPage.invites.created' | t: { date: _created() } }}
    </h3>
    <p class="invite-row__meta">{{ 'teamPage.invites.expires' | t: { date: _expires() } }}</p>
    <p class="invite-row__url">
      <span class="sr-only">{{ 'teamPage.invites.address' | t }}: </span>
      <code appUiText="code">{{ url() }}</code>
    </p>
  </div>
  <div class="invite-row__actions">
    <button
      [attr.aria-label]="'teamPage.invites.copyNamed' | t: { date: _created() }"
      (click)="copyLink.emit()"
      appUiButton
      variant="outline"
      type="button"
    >
      <app-ui-icon name="copy" />
      {{ 'teamPage.invites.copy' | t }}
    </button>
    @if (canShare()) {
      <button
        [attr.aria-label]="'teamPage.invites.shareNamed' | t: { date: _created() }"
        (click)="shareLink.emit()"
        appUiButton
        variant="outline"
        type="button"
      >
        <app-ui-icon name="share" />
        {{ 'teamPage.invites.share' | t }}
      </button>
    }
    <button
      [attr.aria-label]="'teamPage.invites.revokeNamed' | t: { date: _created() }"
      (click)="revoke.emit()"
      appUiButton
      variant="ghost"
      type="button"
    >
      {{ 'teamPage.invites.revoke' | t }}
    </button>
  </div>
</div>
