@let item = invite();
<div class="invite-row" [attr.data-invite]="item.id">
  <div class="invite-row__info">
    <h3 class="invite-row__title" appUiText="item">{{ item.name }}</h3>
    <p class="invite-row__meta">
      {{
        'userList.invites.expires' | t: { date: item.expiresAt | localDate: 'dateTime' : _timeZone }
      }}
    </p>
    <p class="invite-row__url">
      <span class="sr-only">{{ 'userList.invites.address' | t: { name: item.name } }}: </span>
      <code appUiText="code">{{ url() }}</code>
    </p>
  </div>
  <div class="invite-row__actions">
    <button
      [attr.aria-label]="'userList.invites.copyNamed' | t: { name: item.name }"
      (click)="copyLink.emit()"
      appUiButton
      variant="outline"
      size="sm"
      type="button"
    >
      <app-ui-icon name="link" />
      {{ 'userList.invites.copy' | t }}
    </button>
    <button
      [attr.aria-label]="'userList.invites.revokeNamed' | t: { name: item.name }"
      (click)="revoke.emit()"
      appUiButton
      variant="ghost"
      size="sm"
      type="button"
    >
      {{ 'userList.invites.revoke' | t }}
    </button>
  </div>
</div>
