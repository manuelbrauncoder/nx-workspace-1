<article class="event-card" appUiCard>
  <div appUiCardHeader>
    <h3 appUiCardTitle>
      <a class="event-card__link" [routerLink]="['/events', event().id]">{{ event().title }}</a>
    </h3>
    <p appUiCardDescription><app-event-when [event]="event()" /></p>
  </div>
  @if (event().locationName; as place) {
    <p class="event-card__place" appUiCardContent>
      <app-ui-icon name="mapPin" />
      {{ place }}
    </p>
  }
  <p appUiCardFooter appUiText="muted">
    {{
      'events.counts.summary'
        | t: { coming: event().counts.coming, pending: event().counts.pending }
    }}
  </p>
</article>
