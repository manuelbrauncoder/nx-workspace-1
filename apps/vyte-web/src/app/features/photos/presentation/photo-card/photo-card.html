@let item = photo();
<article class="photo-card">
  <button
    class="photo-card__open"
    [attr.aria-label]="'photoList.card.openNamed' | t: { name: _name(), number: number() }"
    (click)="open.emit()"
    type="button"
  >
    <img
      [height]="item.height"
      [ngSrc]="src()"
      [priority]="priority()"
      [width]="item.width"
      alt=""
    />
  </button>
  <div class="photo-card__body">
    <div class="photo-card__head">
      <h3 class="photo-card__name" appUiText="item">{{ _name() }}</h3>
      <button
        [appUiMenuTrigger]="actions"
        [attr.aria-label]="'photoList.card.actions' | t: { name: _name(), number: number() }"
        [loading]="busy()"
        [loadingLabel]="'photoList.card.saving' | t"
        appUiButton
        variant="ghost"
        size="icon"
        type="button"
        align="end"
      >
        <app-ui-icon name="ellipsis" />
      </button>
    </div>
    <p class="photo-card__meta">
      <time [attr.datetime]="item.createdAt.toISOString()">{{
        item.createdAt | localDate: 'dateTime' : _timeZone
      }}</time>
    </p>
    <p class="photo-card__badges">
      <span appUiBadge>
        {{ (item.source === 'guest' ? 'photoList.card.placeCard' : 'photoList.card.stand') | t }}
      </span>
      @if (item.hidden) {
        <span appUiBadge variant="secondary">
          <app-ui-icon name="shieldOff" />
          {{ 'photoList.card.hidden' | t }}
        </span>
      }
    </p>
  </div>
</article>

<ng-template #actions>
  <app-ui-menu class="w-56">
    <app-ui-menu-group>
      <button [disabled]="busy()" (triggered)="toggleHidden.emit()" appUiMenuItem type="button">
        <app-ui-icon [name]="item.hidden ? 'shield' : 'shieldOff'" />
        {{ (item.hidden ? 'photoList.card.show' : 'photoList.card.hide') | t }}
      </button>
      <button
        [disabled]="busy()"
        (triggered)="remove.emit()"
        appUiMenuItem
        variant="destructive"
        type="button"
      >
        <app-ui-icon name="trash" />
        {{ 'photoList.card.remove' | t }}
      </button>
    </app-ui-menu-group>
  </app-ui-menu>
</ng-template>
