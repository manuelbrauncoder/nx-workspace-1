<form (submit)="_save($event)">
  <app-ui-dialog
    [heading]="'showcaseComponents.dialog.heading' | t"
    [description]="'showcaseComponents.dialog.description' | t"
  >
    <app-form-text
      [formField]="_nameForm.name"
      [label]="'showcaseComponents.dialog.name' | t"
      autocomplete="off"
    />
    <div appUiDialogFooter>
      <button (click)="_dialogRef.close()" appUiButton variant="outline" type="button">
        {{ 'common.cancel' | t }}
      </button>
      <button appUiButton type="submit">{{ 'showcaseComponents.dialog.apply' | t }}</button>
    </div>
  </app-ui-dialog>
</form>
