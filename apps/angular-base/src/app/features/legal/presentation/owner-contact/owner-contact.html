<address class="owner-contact">
  <p>{{ _owner.name }}</p>
  @for (line of _owner.address; track $index) {
    <p>{{ line }}</p>
  }
  <p>
    {{ 'legal.email' | t }}:
    <a class="underline underline-offset-4" [href]="_mailHref">{{ _owner.email }}</a>
  </p>
  @if (_owner.phone; as phone) {
    <p>
      {{ 'legal.phone' | t }}:
      <a class="underline underline-offset-4" [href]="_phoneHref">{{ phone }}</a>
    </p>
  }
</address>
