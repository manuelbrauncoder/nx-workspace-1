# Example production stack (Portainer + Traefik). Replace the image, host and paths.
services:
  migrate:
    image: ghcr.io/your-user/portfolio-api:v1.0.0
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - api-network
    command: ['node', 'dist/scripts/migrate.js']

  api:
    image: ghcr.io/your-user/portfolio-api:v1.0.0
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # see config/production.example.json
      - /api-config/api/backend_config.json:/app/config/production.json:ro
      - /api-data/api/uploads:/app/uploads
    environment:
      NODE_ENV: production
      CONFIG_PATH: /app/config/production.json
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.api.rule=Host(`api.example.com`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=3000
      - traefik.http.routers.api.service=api
    networks:
      - api-network
      - web

networks:
  web:
    external: true
  api-network:
    external: true
    name: api-network
