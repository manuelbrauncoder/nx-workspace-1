<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Manuel Braun">
  <title>Manuel Braun</title>
  <style>
    .ground { fill: #142a20; }
    .sign { fill: #f2c230; }
    .glyph { fill: none; stroke: #142a20; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
    /* Dark tabs: the colors swap, so the icon stays visible. */
    @media (prefers-color-scheme: dark) {
      .ground { fill: #f2c230; }
      .sign { fill: #142a20; }
      .glyph { stroke: #f2c230; }
    }
  </style>
  <rect class="ground" width="64" height="64" rx="14" />
  <g transform="translate(0 4)">
    <!-- A trail sign pointing right, reading </> : the tip of the sign is the closing chevron. -->
    <path class="sign" d="M10 15 H43.5 L56 28 L43.5 41 H10 Q8 41 8 39 V17 Q8 15 10 15 Z" />
    <path class="glyph" d="M22.5 21.5 L16.5 28 L22.5 34.5" />
    <path class="glyph" d="M33 20.5 L27.5 35.5" />
    <path class="glyph" d="M40 21.5 L46 28 L40 34.5" />
  </g>
</svg>
