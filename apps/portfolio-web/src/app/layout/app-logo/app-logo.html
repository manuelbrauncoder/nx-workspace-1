<!-- The label repeats the visible text, so voice control still finds the link by its name. -->
<a class="app-logo" [attr.aria-label]="'layout.logo.homeLabel' | t" routerLink="/">
  <!-- The sign reads `</MB`, the chevron in its tip closes the tag. -->
  <span class="app-logo__sign" aria-hidden="true"
    >&lt;/MB<span class="app-logo__chevron"></span
  ></span>
  <span class="app-logo__text">
    <span class="app-logo__name">{{ _name }}</span>
    <span class="app-logo__tagline">{{ 'layout.logo.tagline' | t }}</span>
  </span>
</a>
