<footer class="app-footer">
  <div class="page-container app-footer__bar">
    <div class="app-footer__brand">
      <app-logo />
      <!-- English in every language ("Gemacht mit Liebe" reads oddly), hence `lang` and the same
           text in de.json and en.json. -->
      <p class="app-footer__made-with" lang="en">
        {{ 'layout.footer.madeWith' | t }}
        <app-ui-icon class="app-footer__heart" [label]="'layout.footer.love' | t" name="heart" />
        {{ 'layout.footer.inPlace' | t }}
        @if (_version) {
          <span aria-hidden="true">·</span>
          <span>{{ 'layout.footer.version' | t: { version: _version } }}</span>
        }
      </p>
    </div>
    <nav [attr.aria-label]="'layout.legalNavigation' | t">
      <ul class="app-footer__links">
        @for (item of _items; track item.path) {
          <li>
            <a
              class="app-footer__link"
              [routerLink]="item.path"
              routerLinkActive
              ariaCurrentWhenActive="page"
            >
              {{ item.labelKey | t }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</footer>
