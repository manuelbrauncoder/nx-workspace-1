<a class="skip-link" (click)="_skipToMain($event)" href="#main">{{ 'layout.skipToContent' | t }}</a>

<app-header [(drawerOpen)]="_drawerOpen" />

<main
  class="app-main"
  id="main"
  #main
  [class.page-container]="_layout() === 'contained'"
  [class.app-main--contained]="_layout() === 'contained'"
  tabindex="-1"
>
  <router-outlet />
</main>

<app-footer />

<app-drawer [(open)]="_drawerOpen" />
