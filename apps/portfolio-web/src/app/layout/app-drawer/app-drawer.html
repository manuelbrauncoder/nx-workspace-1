<app-ui-sheet
  [(open)]="open"
  [heading]="'layout.navigation' | t"
  (closed)="_onClosed()"
  side="right"
  fullWidth
  hideHeading
>
  <!-- A click on the logo on the start page triggers no navigation that would close the drawer. -->
  <app-logo (click)="open.set(false)" appUiSheetHeader />
  <!-- A column as tall as the panel: language and theme sit at its bottom. -->
  <div class="app-drawer__content">
    <!-- A link to a section of the current page may trigger no navigation either. -->
    <app-ui-nav-menu
      [items]="_items"
      [label]="'layout.mainNavigation' | t"
      (click)="_closeOnLink($event)"
      orientation="vertical"
      appearance="buttons"
    />
    <!-- Nothing while signed out: a public site shows no link to the sign-in page. -->
    <app-account-menu class="app-drawer__account" [showSignIn]="false" layout="list" />
    <div class="app-drawer__settings">
      <app-language-toggle size="lg" />
      <app-theme-toggle size="lg" />
    </div>
  </div>
</app-ui-sheet>
