<header class="app-header">
  <div class="page-container app-header__bar">
    <app-logo class="app-header__logo" signOnTablet />
    <app-ui-nav-menu
      class="app-header__nav"
      [items]="_items"
      [label]="'layout.mainNavigation' | t"
    />
    <div class="app-header__actions">
      <!-- Below `md` the links and the settings move into the drawer. -->
      <app-settings-menu class="app-header__settings" />
      <button
        class="app-header__menu-button"
        [attr.aria-expanded]="drawerOpen()"
        [attr.aria-label]="'layout.openMenu' | t"
        (click)="drawerOpen.set(true)"
        appUiButton
        variant="ghost"
        size="icon-lg"
        type="button"
        aria-haspopup="dialog"
      >
        <app-ui-icon name="menu" size="xl" />
      </button>
    </div>
  </div>
</header>
