@for (drawing of _drawings(); track drawing.viewBox) {
  <svg
    class="topo-map"
    [class.topo-map--narrow]="drawing.screen === 'narrow'"
    [class.topo-map--wide]="drawing.screen === 'wide'"
    [attr.viewBox]="drawing.viewBox"
    preserveAspectRatio="xMaxYMin slice"
  >
    @for (hill of drawing.hills; track $index) {
      <g [attr.transform]="hill.transform">
        @for (ring of hill.rings; track $index) {
          <path
            class="topo-map__ring"
            [class.topo-map__ring--major]="ring.major"
            [attr.d]="ring.d"
            [attr.transform]="ring.transform"
          />
        }
      </g>
    }
    @if (drawing.pin; as pin) {
      <circle class="topo-map__pin" [attr.cx]="pin.x" [attr.cy]="pin.y" r="9" />
      @if (drawing.screen === 'narrow') {
        @if (place(); as place) {
          <!-- Little room beside the pin on a phone, so the name of the place sits above it. -->
          <text
            class="topo-map__place topo-map__place--centered"
            [attr.x]="pin.x"
            [attr.y]="pin.y - 20"
          >
            {{ place }}
          </text>
        }
      } @else {
        @if (place(); as place) {
          <text class="topo-map__place" [attr.x]="pin.x + 20" [attr.y]="pin.y - 4">
            {{ place }}
          </text>
        }
        @if (coordinates(); as coordinates) {
          <text class="topo-map__coordinates" [attr.x]="pin.x + 20" [attr.y]="pin.y + 16">
            {{ coordinates }}
          </text>
        }
      }
    }
  </svg>
}
