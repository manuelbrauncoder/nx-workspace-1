<h3 class="skill-signpost__sign">{{ set().title | localized }}</h3>
<ul class="skill-signpost__post">
  @for (skill of set().skills; track $index) {
    <li class="skill-signpost__skill">
      <span class="skill-signpost__name">{{ skill.name | localized }}</span>
      <ul class="skill-signpost__uses">
        @for (point of skill.points | localized; track $index) {
          <li class="skill-signpost__use">{{ point }}</li>
        }
      </ul>
    </li>
  }
</ul>
