@let item = hero();
<section class="hero">
  <div class="page-container hero__stage" #stage>
    <!-- One set of lines for the headline and its magnified copy in the glass sphere. -->
    <ng-template #lines>
      <span class="hero__line"
        ><span>{{ item.name }}</span
        >&ngsp;</span
      >
      <span class="hero__line"
        ><em class="hero__accent">{{ item.roleAccent | localized }}</em
        >&ngsp;<span>{{ item.role | localized }}</span></span
      >
    </ng-template>
    <h1 class="hero__headline" #headline appUiText="display">
      <ng-container *ngTemplateOutlet="lines" />
    </h1>
    <app-hero-lens [stage]="stage" [headline]="headline">
      <div class="hero__headline hero__headline--copy" #copy aria-hidden="true" inert>
        <ng-container *ngTemplateOutlet="lines" />
      </div>
    </app-hero-lens>
  </div>

  <div class="page-container hero__foot">
    <span class="hero__spacer" aria-hidden="true"></span>
    <div class="hero__actions">
      <a class="hero__cta hero__cta--solid" appUiButton routerLink="/" fragment="projects">
        {{ 'portfolioHome.hero.checkWork' | t }}
        <app-ui-icon class="hero__cta-arrow" name="arrowRight" />
      </a>
      <a class="hero__cta" appUiButton variant="outline" routerLink="/" fragment="contact">
        {{ 'portfolioHome.hero.contactMe' | t }}
      </a>
    </div>
    <app-scroll-cue class="hero__scroll-cue" />
  </div>
</section>
