@let item = about();
<!-- `tabindex` lets the shell move focus here after a jump from the navigation. -->
<section class="about" id="about" aria-labelledby="about-heading" tabindex="-1">
  <div class="page-container about__layout">
    <h2 class="about__heading" id="about-heading" appReveal appUiText="section">
      {{ item.headline | localized }}
    </h2>
    <!-- The frame sets the size, the image fills it (`fill`): a new portrait from the editor only
         changes the source, and Angular does not take the cropped 4:5 frame for a distortion. -->
    <div class="about__portrait" appReveal>
      <img
        class="about__portrait-image"
        [alt]="item.image.alt | localized"
        [ngSrc]="item.image.url"
        fill
      />
    </div>
    <div class="about__text">
      <p class="about__intro" appReveal>{{ item.description | localized }}</p>
      <ul class="about__facts">
        @for (fact of item.facts | localized; track $index; let index = $index) {
          <li class="about__fact" [revealDelay]="index * 0.06" appReveal>{{ fact }}</li>
        }
      </ul>
    </div>
  </div>
</section>
