<form class="flex flex-col gap-8" [formRoot]="_heroForm">
  <app-form-text
    [formField]="_heroForm.name"
    [label]="'sectionEditor.hero.name' | t"
    [description]="'sectionEditor.hero.nameDescription' | t"
    autocomplete="off"
  />
  <app-localized-field
    [field]="_heroForm.roleAccent"
    [label]="'sectionEditor.hero.roleAccent' | t"
    [description]="'sectionEditor.hero.roleAccentDescription' | t"
  />
  <app-localized-field
    [field]="_heroForm.role"
    [label]="'sectionEditor.hero.role' | t"
    [description]="'sectionEditor.hero.roleDescription' | t"
  />
  <app-section-form-footer />
</form>
