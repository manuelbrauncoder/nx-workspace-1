<!doctype html>
<html class="dark" lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Manuel Braun</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f3f0ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)" />
    <script>
      // Sets .dark before the first paint (no flicker). Same logic as ThemeService with
      // DEFAULT_THEME_MODE 'dark' (app.config.ts): without a stored choice the page stays dark,
      // as the class on <html> already says for visitors without JavaScript.
      (function () {
        try {
          var mode = localStorage.getItem('theme');
          var dark =
            mode === 'light'
              ? false
              : mode === 'system'
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
