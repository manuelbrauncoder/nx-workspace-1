<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Manuel Braun</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- The page starts light whatever the system says, so the browser bar does too. -->
    <meta name="theme-color" content="#f3f0ea" />
    <script>
      // Sets .dark before the first paint (no flicker). Same logic as ThemeService with
      // DEFAULT_THEME_MODE 'light' (app.config.ts): without a stored choice the page stays light,
      // also on a system in dark mode. Dark only when chosen, or with "system" in dark mode.
      (function () {
        try {
          var mode = localStorage.getItem('theme');
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
