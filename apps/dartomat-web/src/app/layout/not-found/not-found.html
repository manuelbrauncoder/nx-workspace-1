<main class="not-found page-container">
  <p class="not-found__wordmark">
    <span class="not-found__marker" aria-hidden="true"></span>
    {{ 'layout.appName' | t }}
  </p>
  <div class="not-found__body">
    <h1 class="not-found__heading" appUiText="h1">{{ 'notFound.heading' | t }}</h1>
    <p appUiText="lead">{{ 'notFound.description' | t }}</p>
  </div>
  <a class="not-found__action" appUiButton variant="brand" size="lg" routerLink="/setup">
    {{ 'notFound.backToSetup' | t }}
    <app-ui-icon name="arrowRight" />
  </a>
</main>
