name: CI

on:
  push:
    branches: [main]
    # One release tag per app, e.g. nx1-angular-base-v1.2.0 or nx1-portfolio-api-v1.2.0.
    tags:
      [
        'nx1-angular-base-v*',
        'nx1-express-api-base-v*',
        'nx1-portfolio-web-v*',
        'nx1-portfolio-api-v*',
        'nx1-dartomat-web-v*',
        'nx1-dartomat-api-v*',
        'nx1-vyte-web-v*',
        'nx1-vyte-api-v*',
      ]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or pull request replaces the running check. A release is
# never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  actions: read
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest

    # Same credentials as docker-compose.yml, which the Vitest configs of the API projects expect
    # by default. Each of them creates and migrates its own test database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `nx affected` compares against the last successful run on main.
          fetch-depth: 0

      # Before pnpm, which refuses to run on another Node version (`devEngines` in package.json).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Takes the version from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set base and head for nx affected
        uses: nrwl/nx-set-shas@v4

      - name: Format check
        run: pnpm format:check

      # `nx release` derives the versions from the commit messages, so every commit of a pull
      # request must follow Conventional Commits (commitlint.config.mjs).
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # A branch or pull request checks what the change affects. A release tag checks only its
      # app (nx1-dartomat-web-v1.2.0 → dartomat-web): the commit was checked on main before
      # `nx release` tagged it, and its libs are built along with it.
      # Four tasks at a time, one per core of the runner.
      - name: Lint, typecheck, unit tests, build
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            app="${GITHUB_REF_NAME#nx1-}"
            app="${app%-v*}"
            pnpm nx run-many -t lint typecheck test build -p "$app" --parallel=4
          else
            pnpm nx affected -t lint typecheck test build --parallel=4
          fi

  publish-angular-base:
    name: Build and push angular-base image
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/nx1-angular-base-v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag `nx1-angular-base-v1.2.0` becomes image `ghcr.io/<owner>/nx1-angular-base:v1.2.0`.
      # Expressions reach the script only through env, never pasted into it.
      - name: Set image metadata
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_REF_NAME#nx1-angular-base-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release tag must end in v<major>.<minor>.<patch>, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "image=ghcr.io/${owner}/nx1-angular-base" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/angular-base/Dockerfile
          push: true
          cache-from: type=gha,scope=angular-base
          cache-to: type=gha,mode=max,scope=angular-base
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}

      - name: Deployment summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          {
            echo "## Image published"
            echo ""
            echo "**Tag:** \`${TAG}\`"
            echo "**Commit:** \`sha-${SHORT_SHA}\`"
            echo ""
            echo "Pull: \`${IMAGE}:${TAG}\`"
            echo ""
            echo "Runtime listens on port **4000** (\`PORT\`). Mount the runtime config over \`/app/dist/angular-base/browser/config/app-config.json\` and set \`NG_ALLOWED_HOSTS\` to the public host names."
          } >> "$GITHUB_STEP_SUMMARY"

