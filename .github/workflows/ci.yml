name: CI

on:
  push:
    branches: [main]
    # Release tags nx1-<app>-v<version>, e.g. nx1-portfolio-api-v1.2.0. The publish job checks the
    # format and that apps/<app>/Dockerfile exists.
    tags: ['nx1-*-v*']
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or pull request replaces the running check. A release is
# never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  actions: read
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    # About four times a release run. The default would be six hours.
    timeout-minutes: 20

    # Same credentials as docker-compose.yml, which the Vitest configs of the API projects expect
    # by default. Each of them creates and migrates its own test database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `nx affected` compares against the last successful run on main.
          fetch-depth: 0
          # No later step pushes or fetches, so the token does not stay in .git/config.
          persist-credentials: false

      # Before pnpm, which refuses to run on another Node version (`devEngines` in package.json).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Takes the version from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set base and head for nx affected
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - name: Format check
        run: pnpm format:check

      # `nx release` derives the versions from the commit messages, so every commit of a pull
      # request must follow Conventional Commits (commitlint.config.mjs).
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # A branch or pull request checks what the change affects. A release tag checks only its
      # app (nx1-dartomat-web-v1.2.0 → dartomat-web): the commit was checked on main before
      # `nx release` tagged it, and its libs are built along with it.
      # Four tasks at a time, one per core of the runner.
      - name: Lint, typecheck, unit tests, build
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            app="${GITHUB_REF_NAME#nx1-}"
            app="${app%-v*}"
            pnpm nx run-many -t lint typecheck test build -p "$app" --parallel=4
          else
            pnpm nx affected -t lint typecheck test build --parallel=4
          fi

  # One job for every app, the release tag says which: nx1-portfolio-api-v1.2.0 becomes the image
  # ghcr.io/<owner>/nx1-portfolio-api with the tags v1.2.0, latest and sha-<short commit>.
  # A new app needs no change here, only apps/<app>/Dockerfile and apps/<app>/deploy-notes.md.
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    # About six times an image build. The default would be six hours.
    timeout-minutes: 20
    needs: checks
    if: github.event_name == 'push' && github.ref_type == 'tag'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Expressions reach the script only through env, never pasted into it. The tag must be
      # nx1-<app>-v<major>.<minor>.<patch>, so a pre-release such as -beta.1 fails here before
      # anything is built, and the app must have a Dockerfile.
      - name: Set image metadata
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^nx1-([a-z0-9]+(-[a-z0-9]+)*)-(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::The release tag must be nx1-<app>-v<major>.<minor>.<patch>, got $GITHUB_REF_NAME"
            exit 1
          fi
          app="${BASH_REMATCH[1]}"
          tag="${BASH_REMATCH[3]}"
          if [ ! -f "apps/$app/Dockerfile" ]; then
            echo "::error::No Dockerfile for $app in apps/$app"
            exit 1
          fi
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "app=${app}"
            echo "image=ghcr.io/${owner}/nx1-${app}"
            echo "tag=${tag}"
            echo "short_sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build cache per app, the scopes are the same as before the jobs were merged.
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ steps.meta.outputs.app }}/Dockerfile
          push: true
          cache-from: type=gha,scope=${{ steps.meta.outputs.app }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.app }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}

      - name: Deployment summary
        env:
          APP: ${{ steps.meta.outputs.app }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          {
            echo "## Image published"
            echo ""
            echo "**Tag:** \`${TAG}\`"
            echo "**Commit:** \`sha-${SHORT_SHA}\`"
            echo ""
            echo "Pull: \`${IMAGE}:${TAG}\`"
            if [ -f "apps/$APP/deploy-notes.md" ]; then
              grep -v '^<!--' "apps/$APP/deploy-notes.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
