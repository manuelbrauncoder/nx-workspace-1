          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}

      - name: Deployment summary
        run: |
          {
            echo "## Image published"
            echo ""
            echo "**Tag:** \`${{ steps.meta.outputs.tag }}\`"
            echo "**Commit:** \`sha-${{ steps.meta.outputs.short_sha }}\`"
            echo ""
            echo "Pull: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo ""
            echo "The API listens on port **3000** (\`port\` in the config file). Mount the config file and set \`CONFIG_PATH\`, \`DATABASE_URL\` and \`SESSION_SECRET\`. Apply migrations with \`node dist/scripts/migrate.js\` before starting the API. The API writes to \`/app/uploads\`, a mounted folder must belong to uid 1000."
          } >> "$GITHUB_STEP_SUMMARY"
