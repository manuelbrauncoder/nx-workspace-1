name: CI

on:
  push:
    branches: [main]
    tags: ['angular-base-v*']
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or pull request replaces the running check. A release is
# never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  actions: read
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `nx affected` compares against the last successful run on main.
          fetch-depth: 0

      # Before pnpm, which refuses to run on another Node version (`devEngines` in package.json).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Takes the version from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set base and head for nx affected
        uses: nrwl/nx-set-shas@v4

      - name: Format check
        run: pnpm format:check

      # A release tag checks everything, a branch or pull request only what the change affects.
      - name: Lint, typecheck, unit tests, build
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            pnpm nx run-many -t lint typecheck test build
          else
            pnpm nx affected -t lint typecheck test build
          fi

  publish-angular-base:
    name: Build and push angular-base image
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/angular-base-v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag `angular-base-v1.2.0` becomes image `ghcr.io/<owner>/angular-base:v1.2.0`.
      - name: Set image metadata
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/angular-base" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME#angular-base-}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/angular-base/Dockerfile
          push: true
          cache-from: type=gha,scope=angular-base
          cache-to: type=gha,mode=max,scope=angular-base
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}

      - name: Deployment summary
        run: |
          {
            echo "## Image published"
            echo ""
            echo "**Tag:** \`${{ steps.meta.outputs.tag }}\`"
            echo "**Commit:** \`sha-${{ steps.meta.outputs.short_sha }}\`"
            echo ""
            echo "Pull: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo ""
            echo "Runtime listens on port **4000** (\`PORT\`). Mount the runtime config over \`/app/dist/angular-base/browser/config/app-config.json\` and set \`NG_ALLOWED_HOSTS\` to the public host names."
          } >> "$GITHUB_STEP_SUMMARY"
