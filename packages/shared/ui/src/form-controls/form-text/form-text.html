<app-form-control-shell
  [controlId]="_id"
  [description]="description()"
  [disabled]="disabled()"
  [errors]="_errorMessages()"
  [label]="label()"
  [required]="required()"
>
  <input
    #control
    [id]="_id"
    [attr.autocomplete]="autocomplete() ?? null"
    [attr.name]="name() || null"
    [attr.placeholder]="placeholder() ?? null"
    [disabled]="disabled()"
    [readOnly]="readonly()"
    [required]="required()"
    [type]="type()"
    [value]="value()"
    (blur)="touch.emit()"
    (input)="value.set(control.value)"
    hlmInput
  />
</app-form-control-shell>
