<!-- `novalidate`: the browser would reject an address typed without a scheme. -->
<form (submit)="_apply($event)" novalidate>
  <app-ui-dialog [heading]="'form.richText.linkHeading' | t">
    <app-form-text
      [formField]="_linkForm.address"
      [description]="'form.richText.linkUrlDescription' | t"
      [label]="'form.richText.linkUrl' | t"
      type="url"
      autocomplete="off"
    />
    <div appUiDialogFooter>
      <button (click)="_dialogRef.close()" appUiButton variant="outline" type="button">
        {{ 'common.cancel' | t }}
      </button>
      @if (_current) {
        <button (click)="_dialogRef.close(null)" appUiButton variant="outline" type="button">
          {{ 'form.richText.linkRemove' | t }}
        </button>
      }
      <button appUiButton type="submit">{{ 'form.richText.linkApply' | t }}</button>
    </div>
  </app-ui-dialog>
</form>
