<button
  [appUiMenuTrigger]="menu"
  [attr.aria-label]="'language.choose' | t"
  [size]="size() === 'lg' ? 'icon-lg' : 'icon'"
  appUiButton
  variant="ghost"
  type="button"
  align="end"
>
  <app-ui-icon [size]="size() === 'lg' ? 'lg' : undefined" name="languages" />
</button>

<ng-template #menu>
  <app-ui-menu class="w-40">
    <app-ui-menu-group>
      @for (option of _options; track option.language) {
        <button
          [attr.lang]="option.language"
          [checked]="_i18n.language() === option.language"
          (triggered)="_i18n.setLanguage(option.language)"
          appUiMenuRadio
          type="button"
        >
          {{ option.label }}
        </button>
      }
    </app-ui-menu-group>
  </app-ui-menu>
</ng-template>
