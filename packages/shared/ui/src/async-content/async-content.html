@switch (state().loadingState) {
  @case ('loading') {
    @if (loadingIndicator() === 'skeleton') {
      <p class="sr-only" role="status">{{ loadingLabel() ?? ('common.loading' | t) }}</p>
      <div class="async-content__skeleton" aria-hidden="true">
        <div class="h-8 w-1/3" appUiSkeleton></div>
        <div class="h-24" appUiSkeleton></div>
        <div class="h-24" appUiSkeleton></div>
      </div>
    } @else {
      <div class="async-content__loading">
        <app-ui-spinner class="async-content__spinner" [label]="loadingLabel()" />
      </div>
    }
  }
  @case ('failure') {
    @if (state().failure; as failure) {
      <app-failure-alert
        [heading]="failureHeading()"
        [headingLevel]="failureHeadingLevel()"
        [failure]="failure"
        [retryable]="retryable()"
        (retry)="retry.emit()"
      />
    }
  }
  <!-- `idle` means there is nothing to load, e.g. a form for a new entry. -->
  @case ('idle')
  @case ('success') {
    <ng-container [ngTemplateOutlet]="_content()" />
  }
}
