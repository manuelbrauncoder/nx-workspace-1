@if (items().length > 1) {
  <!-- The bindings replace the English role descriptions the helm components set. -->
  <hlm-carousel
    class="ui-carousel"
    #carousel
    [attr.aria-label]="label()"
    [attr.aria-roledescription]="'common.carousel.roleDescription' | t"
    [options]="_options"
  >
    <div hlmCarouselContent>
      @for (item of items(); track $index; let index = $index) {
        <div
          [attr.aria-label]="
            'common.carousel.slide' | t: { number: index + 1, count: items().length }
          "
          [attr.aria-roledescription]="'common.carousel.slideRoleDescription' | t"
          hlmCarouselItem
        >
          <ng-container *ngTemplateOutlet="_slide(); context: { $implicit: item, index: index }" />
        </div>
      }
    </div>
    <div class="ui-carousel__controls">
      <button
        [attr.aria-label]="previousLabel() ?? ('common.carousel.previous' | t)"
        [disabled]="!carousel.canScrollPrev()"
        (click)="carousel.scrollPrev()"
        appUiButton
        variant="outline"
        size="icon"
        type="button"
      >
        <app-ui-icon name="arrowLeft" />
      </button>
      <p class="ui-carousel__position" aria-live="polite">
        {{
          'common.carousel.slide'
            | t: { number: carousel.currentSlide() + 1, count: items().length }
        }}
      </p>
      <button
        [attr.aria-label]="nextLabel() ?? ('common.carousel.next' | t)"
        [disabled]="!carousel.canScrollNext()"
        (click)="carousel.scrollNext()"
        appUiButton
        variant="outline"
        size="icon"
        type="button"
      >
        <app-ui-icon name="arrowRight" />
      </button>
    </div>
  </hlm-carousel>
} @else if (items()[0]; as item) {
  <ng-container *ngTemplateOutlet="_slide(); context: { $implicit: item, index: 0 }" />
}
