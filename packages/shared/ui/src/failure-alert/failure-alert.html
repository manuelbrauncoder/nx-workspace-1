<app-ui-alert [heading]="heading()" [headingLevel]="headingLevel()" variant="destructive">
  {{ _text() }}
  @if (retryable()) {
    <button
      (click)="retry.emit()"
      appUiAlertAction
      appUiButton
      variant="outline"
      size="sm"
      type="button"
    >
      {{ 'common.retry' | t }}
    </button>
  }
</app-ui-alert>
