<button
  [appUiMenuTrigger]="menu"
  [attr.aria-label]="'theme.choose' | t"
  [size]="size() === 'lg' ? 'icon-lg' : 'icon'"
  appUiButton
  variant="ghost"
  type="button"
  align="end"
>
  <app-ui-icon
    [name]="_theme.resolved() === 'dark' ? 'moon' : 'sun'"
    [size]="size() === 'lg' ? 'lg' : undefined"
  />
</button>

<ng-template #menu>
  <app-ui-menu class="w-40">
    <app-ui-menu-group>
      @for (option of _options; track option.mode) {
        <button
          [checked]="_theme.mode() === option.mode"
          (triggered)="_theme.setMode(option.mode)"
          appUiMenuRadio
          type="button"
        >
          {{ option.labelKey | t }}
        </button>
      }
    </app-ui-menu-group>
  </app-ui-menu>
</ng-template>
