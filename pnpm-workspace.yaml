allowBuilds:
  # Telemetry of swagger-ui-express, not needed.
  '@scarf/scarf': false
  argon2: true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  # Only a postinstall check for its native binary, which the optional dependencies already ship.
  unrs-resolver: false
